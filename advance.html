<head>

    <style>
        input[type="text"]{
            border: 1px solid red;
            color:green
        }

        ul>li{
            color:red
        }
        a:hover{
            color: green;
        }
        li:nth-child(3){
            color: green;
        }

        p::first-letter{
            font-size: 50px;
        }

        .lead::after{
            content:"zennah"
        }
        .lead::before{
            content: "lukman";
        }

    </style>

<body>
    <input type="text">
    <ul>
        <li>apple</li>
        <li>guava</li>
        <li>banana</li>
    </ul>

        <h1 class="lead">
            my name is mayank singh
