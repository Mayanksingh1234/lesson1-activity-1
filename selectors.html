<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <style>
        input[type="Text"]{
            color: red;
            border: 1px solid red;
        }
        ul>li{
            color: cadetblue;
        }
        #div1:hover{
            background-color: red;
        }
        #div1{
           width: 100px;
            height: 100px;
            background-color: yellow;
        }
        #div2{
            background-color: red;
        }
        li:nth-child(3){
            color: blue;
        }

        h1::before{
            content: "my name is ";
        }
        h1::after{
            content: " i  am class 1st";
        }
        p::first-letter{
            font-size: 60px;
            color: aqua;
        }


    </style>

<body>
    <input type="text">
    <ul>
        <li>apple</li>
        <li>banana</li>
        <li>mango</li>
    </ul>
    <div id="div1" ></div>
    <div id="div2" style="background-color: yellow; width: 200px; height: 200px;"></div>


    <h1>mayank singh</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quas asperiores accusamus perspiciatis corporis quis eveniet molestias? Reiciendis voluptatum hic nobis.</p>
</body>
</html>
